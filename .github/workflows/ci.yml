name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: DisqueteiraFrontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: DisqueteiraFrontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # TODO: add `pnpm lint` and `pnpm test` once they work again. `lint` uses
      # `--ext`, which ESLint 9 flat config rejects, and `vitest` isn't installed.
      - run: pnpm build
